    <h1 data-en="Summer Tomato &amp; Basil Pasta" data-bn="গ্রীষ্মের টমেটো ও বেসিল পাস্তা"></h1>
    <p class="lede" data-en="The first warm evening of the year, on a plate." data-bn="বছরের প্রথম উষ্ণ সন্ধ্যা, এক প্লেটে।"></p>
    <div class="meta">

  <div class="recipe-hero"><img src="../assets/recipe-pasta-CuOctBgM.jpg" alt="Summer Tomato & Basil Pasta" /></div>

  <div class="article-body">
<div class="recipe-split">
<aside class="ing-panel">
<div class="block">
      <span class="label" data-en="you'll need" data-bn="যা যা লাগবে"></span>
      <h2 data-en="Ingredients" data-bn="উপকরণ"></h2>
      <ul class="ingredients">
        <li data-en="400g spaghetti" data-bn="৪০০ গ্রাম স্প্যাগেটি"></li>
        <li data-en="600g ripe summer tomatoes, roughly chopped" data-bn="৬০০ গ্রাম পাকা গ্রীষ্মের টমেটো, মোটা করে কাটা"></li>
        <li data-en="4 garlic cloves, thinly sliced" data-bn="৪ কোয়া রসুন, পাতলা করে কাটা"></li>
        <li data-en="1 large bunch fresh basil, leaves torn" data-bn="১ আঁটি তাজা বেসিল, পাতা ছেঁড়া"></li>
        <li data-en="6 tbsp good extra-virgin olive oil" data-bn="৬ টেবিল-চামচ ভালো এক্সট্রা-ভার্জিন অলিভ অয়েল"></li>
        <li data-en="Flaky sea salt &amp; cracked pepper" data-bn="ফ্লেকি সি সল্ট ও গোলমরিচ গুঁড়ো"></li>
        <li data-en="Parmigiano, to finish" data-bn="শেষে ছড়ানোর জন্য পারমিজানো"></li>
      </ul>
    </div>
</aside>
<div class="recipe-flow">
<div class="block">
      <span class="label" data-en="the story" data-bn="গল্পটা"></span>
      <p data-en="There is a tomato plant on my grandmother's terrace that has been there longer than I have. Every June it begins, shy and green, and by August it is so heavy with fruit that we tie its limbs to the railing with kitchen string." data-bn="আমার ঠাকুমার ছাদে একটা টমেটো গাছ আছে, যেটা আমার চেয়েও পুরোনো। প্রতি জুন মাসে সে শুরু করে—লাজুক আর সবুজ; আর অগাস্ট আসতে আসতে ফলের ভারে এমন নুয়ে পড়ে যে আমরা তার ডালগুলো রান্নাঘরের সুতো দিয়ে রেলিঙে বেঁধে রাখি।"></p>
      <p data-en="This is the dish she made the first time the tomatoes were ready. No measuring, no fuss — only ripe fruit, torn basil, and the kind of olive oil you save for when it matters." data-bn="টমেটো প্রথমবার পাকলে ঠাকুমা এই পদটাই বানাতেন। কোনো মাপজোক নেই, ঝামেলা নেই—শুধু পাকা টমেটো, ছেঁড়া বেসিল, আর সেই অলিভ অয়েল যেটা বিশেষ দিনের জন্য তুলে রাখা থাকে।"></p>
    </div>
<div class="block">
      <span class="label" data-en="how to" data-bn="যেভাবে"></span>
      <h2 data-en="The recipe" data-bn="রেসিপি"></h2>
      <ol class="steps">
        <li data-en="Bring a large pot of well-salted water to a boil and drop in the spaghetti." data-bn="একটা বড় পাত্রে ভালো করে নুন দেওয়া জল ফুটিয়ে নিন, তারপর স্প্যাগেটি ছেড়ে দিন।"></li>
        <li data-en="While it cooks, warm the olive oil in a wide pan over low heat. Add the garlic and let it soften without browning, about 3 minutes." data-bn="পাস্তা সেদ্ধ হওয়ার ফাঁকে একটা চওড়া প্যানে কম আঁচে অলিভ অয়েল গরম করুন। রসুন দিয়ে বাদামি না করে নরম হতে দিন—মিনিট তিনেক।"></li>
        <li data-en="Tip in the tomatoes and a generous pinch of salt. Increase heat and cook, crushing gently with a spoon, until the tomatoes break down into a loose sauce — 8 to 10 minutes." data-bn="টমেটো আর এক চিমটি নুন দিয়ে দিন। আঁচ বাড়িয়ে চামচ দিয়ে আলতো করে চটকে রান্না করুন, যতক্ষণ না টমেটো গলে পাতলা সসের মতো হয়—৮ থেকে ১০ মিনিট।"></li>
        <li data-en="Drain the pasta, reserving a cup of cooking water. Toss it into the sauce with most of the basil and a splash of pasta water." data-bn="পাস্তার জল ঝরিয়ে নিন, এক কাপ জল আলাদা রেখে দিন। বেশিরভাগ বেসিল আর একটু পাস্তার জল দিয়ে পাস্তাটা সসে মিশিয়ে নিন।"></li>
        <li data-en="Serve at once, showered with parmigiano, the rest of the basil, and another thread of oil." data-bn="সঙ্গে সঙ্গে পরিবেশন করুন—উপরে পারমিজানো, বাকি বেসিল আর সামান্য অলিভ অয়েল ছড়িয়ে।"></li>
      </ol>
    </div>
</div>
