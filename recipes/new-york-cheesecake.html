<div class="recipe-intro">
<div class="block">
      <span class="label" data-en="the story" data-bn="গল্পটা"></span>
      <p data-en="I haven&rsquo;t been baking long — just two years. I started on the 6th of August, the day before my birthday, and the first thing I ever made was a New York cheesecake. It&rsquo;s been part of my happiness ever since." data-bn="বেশিদিন হয়নি আমি বেকিং শুরু করেছি — বছর দুয়েক। শুরুটা ছিল ৬ই অগাস্ট, আমার জন্মদিনের ঠিক আগের দিন। আর প্রথম যেটা বানিয়েছিলাম, সেটা একটা নিউ ইয়র্ক চিজকেক। সেই থেকে ওটা আমার সুখের একটা টুকরো হয়ে আছে।"></p>
      <p data-en="Here&rsquo;s what I love about cheesecake: it doesn&rsquo;t really let you down. You can get half of it wrong and it&rsquo;ll still taste good — and that&rsquo;s rare in baking. But there&rsquo;s a difference between good and the kind that makes someone go quiet after the first bite. That difference is precision. So weigh it out. Take your time." data-bn="চিজকেকের সবচেয়ে ভালো ব্যাপারটা কী আসলে? এ কখনও নিরাশ করে না। যতই এলোমেলো হোক, যতই এপাশ ওপাশ হোক, শেষমেশ খেতে ভালোই লাগে। আর বেকিং-এ সচরাচর এমনটা দেখা যায় না। কিন্তু &lsquo;ভালো&rsquo;, আর যেটার প্রথম কামড়েই মানুষ বিভোর হয়ে যায় — এই দুটোর মধ্যে একটা ফারাক আছে। সেই ফারাকটার নাম নিখুঁততা। তাই মেপে নাও, সময় নাও।"></p>
      <blockquote class="story-quote" data-en="Be precise. Be amazing." data-bn="নিখুঁত হও। অসাধারণ হও।"></blockquote>
    </div>
</div>

      <h2 data-en="Ingredients" data-bn="উপকরণ"></h2>
      <ul class="ingredients">
        <li data-en="700g cream cheese (Philadelphia or any sort)" data-bn="ক্রিম চিজ — ৭০০ গ্রাম (ফিলাডেলফিয়া বা যেকোনো)"></li>
        <li data-en="140g sugar" data-bn="চিনি — ১৪০ গ্রাম"></li>
        <li data-en="100g unsalted butter, plus extra for the tin" data-bn="মাখন (লবণ ছাড়া) — ১০০ গ্রাম, সঙ্গে টিনের জন্য একটু বেশি"></li>
        <li data-en="3 eggs (medium–large)" data-bn="ডিম — ৩টি (মাঝারি থেকে বড়)"></li>
        <li data-en="12g all-purpose flour" data-bn="ময়দা — ১২ গ্রাম"></li>
        <li data-en="200g heavy cream (over 30% fat)" data-bn="হেভি ক্রিম (৩০%-এর বেশি ফ্যাট) — ২০০ গ্রাম"></li>
        <li data-en="1 pack of biscuits (Leibniz, Lotus Biscoff, or similar)" data-bn="বিস্কুট (লাইবনিৎস, লোটাস বিস্কফ বা এই ধরনের) — এক প্যাকেট"></li>
      </ul>
    </div>
</aside>
<div class="recipe-flow">
<div class="block">
      <span class="label" data-en="how to" data-bn="যেভাবে"></span>
      <h2 data-en="The recipe" data-bn="রেসিপি"></h2>
      <ol class="steps">
        <li data-en="Before you start. Heat the oven to 180°C (top and bottom heat, no fan) at least 30 minutes before you bake. Cheesecake likes a steady, fully warmed oven." data-bn="শুরুর আগে। বেক করার অন্তত ৩০ মিনিট আগে ওভেন ১৮০° সেলসিয়াসে গরম করে নাও (উপর-নিচে তাপ, ফ্যান নয়)। চিজকেক ভালোবাসে ধীরে, ঠিকঠাক গরম হওয়া ওভেন।"></li>
        <li data-en="Crush the biscuits in a food processor, or in a bowl with a rolling pin, until there are no big pieces left — the texture of breadcrumbs." data-bn="বিস্কুটগুলো গুঁড়ো করে নাও — ফুড প্রসেসরে, নয়তো একটা বাটিতে বেলুন দিয়ে — যতক্ষণ না বড় টুকরো আর থাকে। একদম গুঁড়ো গুঁড়ো, ব্রেডক্রাম্বের মতো।"></li>
        <li data-en="Melt the 100g butter in the microwave or a small saucepan, and stir it into the crumbs a little at a time. You don&rsquo;t want them oily — add just enough to bring the crumbs together." data-bn="১০০ গ্রাম মাখন গলিয়ে নাও মাইক্রোওয়েভে বা ছোট একটা সসপ্যানে, তারপর অল্প অল্প করে গুঁড়ো বিস্কুটে মেশাও। বেশি তেলতেলে যেন না হয় — ঠিক যতটুকু লাগে গুঁড়োগুলো একসঙ্গে বেঁধে নিতে, ততটুকুই দাও।"></li>
        <li data-en="Grease a large tin on the bottom and sides with butter (or line it with greaseproof paper) so the cake lifts out cleanly. Tip in the crumbs, spread them evenly, and press down firmly with a spoon, the base of a glass, or a rolling pin until the surface is flat and compact." data-bn="একটা বড় টিনে তলা আর ধার মাখন দিয়ে মাখিয়ে নাও (নয়তো বাটার পেপার বিছিয়ে দাও), যাতে কেকটা সহজে বেরিয়ে আসে। এবার গুঁড়ো বিস্কুট ঢেলে সমান করে ছড়িয়ে দাও, আর একটা চামচ, গ্লাসের তলা বা বেলুন দিয়ে ভালো করে চেপে চেপে সমান, শক্ত একটা তলা বানাও।"></li>
        <li data-en="In a large bowl, whisk together the 3 eggs, 200g cream, 12g flour, and 140g sugar. Once smooth, add the 700g cream cheese and whisk again until the batter is completely smooth and just slightly creamy — stop there, you&rsquo;re not whipping air into it. For a more savoury, tangy cheesecake, grate in a little mature cheese like Parmesan or Grana Padano. Taste it, and trust yourself. 😊" data-bn="একটা বড় বাটিতে ৩টি ডিম, ২০০ গ্রাম ক্রিম, ১২ গ্রাম ময়দা আর ১৪০ গ্রাম চিনি একসঙ্গে ফেটিয়ে নাও। মসৃণ হয়ে এলে ৭০০ গ্রাম ক্রিম চিজ দাও, আবার ফেটাও যতক্ষণ না ব্যাটার একদম মসৃণ আর একটুখানি ক্রিমি হয় — ওখানেই থামো, বেশি ফেটিয়ে হাওয়া ঢুকিয়ো না। একটু নোনতা, টক-টক স্বাদ চাইলে সামান্য পুরনো চিজ — পারমেজান বা গ্রানা পাদানো — কুরিয়ে দিতে পারো। চেখে দেখো, আর নিজের জিভকে বিশ্বাস করো। 😊"></li>
        <li data-en="Blind-bake the base first. Put the tin on the middle shelf and bake the biscuit base alone for 5 minutes, until lightly golden. Then pour in the filling and bake for 18 minutes. Turn the oven off and let the cake rest inside for 3–4 minutes. Keep an eye on the top — it shouldn&rsquo;t brown. When it comes out, the centre should still wobble like soft jelly; don&rsquo;t worry, it sets creamy as it cools. If it firms up too fast, turn the oven off a little earlier." data-bn="আগে শুধু বেসটা বেক করো। টিনটা ওভেনের মাঝের তাকে বসিয়ে বিস্কুটের বেসটা একা ৫ মিনিট বেক করো, যতক্ষণ না হালকা সোনালি হয়। তারপর পুর ঢেলে দাও, আর ১৮ মিনিট বেক করো। এবার ওভেন বন্ধ করে কেকটা ভেতরেই ৩-৪ মিনিট রেখে দাও। উপরটার দিকে খেয়াল রেখো — ওটা যেন বাদামি না হয়। বের করার সময় মাঝখানটা নরম জেলির মতো কাঁপবে; চিন্তা কোরো না, ঠান্ডা হতে হতেই ওটা ক্রিমি হয়ে জমে যায়। যদি খুব তাড়াতাড়ি শক্ত হয়ে যায়, ওভেনটা আরেকটু আগেই বন্ধ কোরো।"></li>
        <li data-en="The hardest part: let the cake cool for 30 minutes to an hour, then refrigerate. Best of all, bake it the day before — a night in the fridge is what gives it that dense, settled, proper cheesecake texture. The waiting is the recipe too." data-bn="সবচেয়ে কঠিন অংশ: কেকটা আধ ঘণ্টা থেকে এক ঘণ্টা ঠান্ডা হতে দাও, তারপর ফ্রিজে রাখো। সবচেয়ে ভালো হয় আগের দিন বানিয়ে রাখলে — সারারাত ফ্রিজে থাকলে তবেই ওই গাঢ়, থিতু, আসল চিজকেকের মতো টেক্সচারটা আসে। এই অপেক্ষাটুকুও কিন্তু রেসিপিরই অংশ।"></li>
      </ol>
    </div>
<div class="block">

<script>
  function setLang(lang){
    document.body.classList.toggle('bn', lang === 'bn');
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(function(el){
      var t = el.getAttribute('data-' + lang);
      if (t !== null) el.innerHTML = t;
    });
    document.querySelectorAll('.lang-toggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.set === lang);
    });
  }
  document.querySelectorAll('.lang-toggle button').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.set); });
  });
  setLang('en');
</script>
