      <span class="label" data-en="the story" data-bn="গল্পটা"></span>
      <p data-en="My father has roasted a chicken almost every Sunday I can remember. The recipe never changed, the kitchen smell never changed, and somehow neither did the way it made the week feel finished." data-bn="যতদূর মনে পড়ে, আমার বাবা প্রায় প্রতি রবিবারেই মুরগি রোস্ট করতেন। রেসিপি কখনও বদলায়নি, রান্নাঘরের গন্ধ বদলায়নি, আর কেমন করে যেন সপ্তাহটা পূর্ণ হয়ে ওঠার অনুভূতিটাও বদলায়নি।"></p>
      <p data-en="When I moved away, this was the first thing I learned to cook properly. It tasted like home long before my own kitchen did." data-bn="যখন বাড়ি ছেড়ে চলে এলাম, ভালো করে রাঁধতে শেখা প্রথম পদ ছিল এটাই। নিজের রান্নাঘর ঘরের মতো হয়ে ওঠার অনেক আগেই এর স্বাদ ছিল ঘরের মতো।"></p>
    </div>
<div class="block">
      <span class="label" data-en="how to" data-bn="যেভাবে"></span>
      <h2 data-en="The recipe" data-bn="রেসিপি"></h2>
      <ol class="steps">
        <li data-en="Heat the oven to 220°C / 425°F. Pat the chicken very dry." data-bn="ওভেন ২২০°সে / ৪২৫°ফা-তে গরম করুন। মুরগিটা ভালো করে শুকনো করে মুছে নিন।"></li>
        <li data-en="Rub the butter all over and under the skin. Season generously inside and out." data-bn="চামড়ার উপরে আর নিচে ভালো করে মাখন মাখিয়ে নিন। ভেতরে-বাইরে দরাজ হাতে নুন-গোলমরিচ ছড়িয়ে দিন।"></li>
        <li data-en="Stuff the cavity with the halved lemon, garlic, and half the thyme. Scatter the rest in the pan with the lemon slices." data-bn="পেটের ভেতরে অর্ধেক লেবু, রসুন আর অর্ধেক থাইম ভরে দিন। বাকিটা লেবুর স্লাইসসহ প্যানে ছড়িয়ে দিন।"></li>
        <li data-en="Roast for 20 minutes, then lower to 180°C / 360°F and continue for 50–60 minutes, basting once or twice, until the juices run clear." data-bn="২০ মিনিট রোস্ট করুন, তারপর আঁচ কমিয়ে ১৮০°সে / ৩৬০°ফা করে আরও ৫০–৬০ মিনিট রান্না করুন; মাঝে এক-দুবার রস মাখিয়ে দিন, যতক্ষণ না রস স্বচ্ছ হয়ে বেরোয়।"></li>
        <li data-en="Rest, uncovered, for 15 minutes before carving. Tip the pan juices over everything." data-bn="কাটার আগে ঢাকা না দিয়ে ১৫ মিনিট রেখে দিন। সবকিছুর উপরে প্যানের রস ঢেলে দিন।"></li>
      </ol>
