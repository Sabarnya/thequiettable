    <h1 data-en="Wild Mushroom Risotto" data-bn="বুনো মাশরুম রিসোতো"></h1>
    <p class="lede" data-en="Slow stirring, a quiet kitchen, a glass of something white." data-bn="ধীরে নাড়া, নিরিবিলি রান্নাঘর, আর এক গ্লাস সাদা কিছু।"></p>
    <div class="meta">
      <div class="row"><span class="k" data-en="time" data-bn="সময়"></span><span class="v" data-en="· 45 min" data-bn="· ৪৫ মিনিট"></span></div>

    </div>
      <button class="cook-start btn btn-solid" data-en="Cook this — step by step →" data-bn="রান্না করুন — ধাপে ধাপে →"></button>
</div>

  <div class="recipe-hero"><img src="../assets/recipe-risotto-CYJhCVEY.jpg" alt="Wild Mushroom Risotto" /></div>

  <div class="article-body">
    <div class="block">
      <span class="label" data-en="the story" data-bn="গল্পটা"></span>
      <p data-en="I learned to make risotto from a chef who told me the secret was to stand still. To not check my phone. To let the rice and I have a conversation that lasted the length of a glass of wine." data-bn="এক শেফের কাছে রিসোতো বানানো শিখেছিলাম, যিনি বলেছিলেন আসল রহস্য হলো স্থির হয়ে দাঁড়িয়ে থাকা। ফোন না দেখা। চালের সঙ্গে এমন এক আলাপ চালিয়ে যাওয়া, যা এক গ্লাস ওয়াইন শেষ হওয়া পর্যন্ত চলে।"></p>
      <p data-en="He was right. The risotto is good, but the standing still is better." data-bn="তিনি ঠিকই বলেছিলেন। রিসোতো ভালো, কিন্তু ওই স্থির হয়ে দাঁড়িয়ে থাকাটা আরও ভালো।"></p>
    </div>
    <div class="block">
      <span class="label" data-en="you'll need" data-bn="যা যা লাগবে"></span>
      <h2 data-en="Ingredients" data-bn="উপকরণ"></h2>
      <ul class="ingredients">
        <li data-en="300g carnaroli or arborio rice" data-bn="৩০০ গ্রাম কার্নারোলি বা আরবোরিও চাল"></li>
        <li data-en="300g mixed wild mushrooms, torn" data-bn="৩০০ গ্রাম মেশানো বুনো মাশরুম, ছেঁড়া"></li>
        <li data-en="1L warm chicken or vegetable stock" data-bn="১ লিটার গরম চিকেন বা সবজির স্টক"></li>
        <li data-en="1 shallot, finely diced" data-bn="১টা শ্যালট, মিহি করে কাটা"></li>
        <li data-en="150ml dry white wine" data-bn="১৫০ মিলি ড্রাই সাদা ওয়াইন"></li>
        <li data-en="60g cold butter, cubed" data-bn="৬০ গ্রাম ঠান্ডা মাখন, কিউব করা"></li>
        <li data-en="60g parmigiano, grated" data-bn="৬০ গ্রাম পারমিজানো, গ্রেট করা"></li>
        <li data-en="Fresh thyme, olive oil" data-bn="তাজা থাইম, অলিভ অয়েল"></li>
      </ul>
    </div>
    <div class="block">
      <span class="label" data-en="how to" data-bn="যেভাবে"></span>
      <h2 data-en="The recipe" data-bn="রেসিপি"></h2>
      <ol class="steps">
        <li data-en="Sear the mushrooms in a hot pan with a little oil until deeply browned. Season and set aside." data-bn="গরম প্যানে সামান্য তেলে মাশরুম ভালো করে বাদামি হওয়া পর্যন্ত সেঁকে নিন। নুন-গোলমরিচ দিয়ে আলাদা করে রাখুন।"></li>
        <li data-en="In the same pan, soften the shallot in oil. Add the rice and toast for 2 minutes until edges turn translucent." data-bn="একই প্যানে তেলে শ্যালট নরম করে নিন। চাল দিয়ে ২ মিনিট ভেজে নিন, যতক্ষণ না কিনারা স্বচ্ছ হয়।"></li>
        <li data-en="Pour in the wine and stir until absorbed." data-bn="ওয়াইন ঢেলে দিন, শুষে না যাওয়া পর্যন্ত নাড়তে থাকুন।"></li>
        <li data-en="Add the warm stock a ladle at a time, stirring gently, waiting until each addition is nearly absorbed before adding the next. 18–20 minutes." data-bn="এক হাতা করে গরম স্টক দিন, আলতো করে নাড়ুন; প্রতিবারের স্টক প্রায় শুষে যাওয়া পর্যন্ত অপেক্ষা করে তবেই পরেরটা দিন। ১৮–২০ মিনিট।"></li>
        <li data-en="Off heat, beat in the butter and parmigiano. Fold the mushrooms through. Rest 2 minutes, then serve with thyme." data-bn="আঁচ বন্ধ করে মাখন আর পারমিজানো ফেটিয়ে মিশিয়ে নিন। মাশরুম আলতো করে মিশিয়ে দিন। ২ মিনিট রেখে থাইম ছড়িয়ে পরিবেশন করুন।"></li>
      </ol>
    </div>
  </div>

<script>
  function setLang(lang){
    document.body.classList.toggle('bn', lang === 'bn');
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(function(el){
      var t = el.getAttribute('data-' + lang);
      if (t !== null) el.innerHTML = t;
    });
    document.querySelectorAll('.lang-toggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.set === lang);
    });
  }
  document.querySelectorAll('.lang-toggle button').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.set); });
  });
  setLang('en');
</script>
