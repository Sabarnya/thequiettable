    <p class="lede" data-en="Crisp at the edge, soft in the middle — and the patience is all in the cooling." data-bn="ধারে মুচমুচে, ভেতরে নরম — আর পুরো ধৈর্যটুকু ওই ঠান্ডা হওয়ার অপেক্ষায়।"></p>
    <div class="meta">

      <div class="row"><span class="k" data-en="makes" data-bn="পরিমাণ"></span><span class="v" data-en="· 10 cookies" data-bn="· ১০টি কুকি"></span></div>

  <div class="recipe-hero"><img src="../assets/recipe-chocolate-cookies.webp" alt="Chocolate cookies, crisp at the edges and soft in the middle" width="1200" height="900" loading="eager" fetchpriority="high" decoding="async" /></div>

  <div class="article-body">
<div class="recipe-intro">
<div class="block">
      <span class="label" data-en="the story" data-bn="গল্পটা"></span>
      <p data-en="After all those cheesecakes with their weighing and their wobble, here&rsquo;s one that asks almost nothing of you. Butter, sugar, cocoa, a handful of chopped chocolate — the kind of thing you can make on a grey afternoon with whatever&rsquo;s in the cupboard." data-bn="এতগুলো চিজকেকের মাপজোখ আর মাঝখানের কাঁপুনির পর, এবার এমন একটা কিছু, যা তোমার কাছে প্রায় কিছুই চায় না। মাখন, চিনি, কোকো, এক মুঠো কুচোনো চকোলেট — মনমরা কোনো বিকেলে আলমারিতে যা আছে তা দিয়েই বানিয়ে ফেলা যায়।"></p>
      <p data-en="There&rsquo;s only one rule, and it&rsquo;s a quiet one: let them cool on the tray. Straight out of the oven they&rsquo;ll feel too soft, almost underdone — and you&rsquo;ll want to move them. Don&rsquo;t. They firm up as they sit. The waiting is the whole trick." data-bn="নিয়ম একটাই, আর সেটা বড় শান্ত — ট্রেতেই ঠান্ডা হতে দাও। ওভেন থেকে বেরোনোর সময় ওদের বড্ড নরম লাগবে, যেন ঠিক হয়নি — হাত নিশপিশ করবে সরিয়ে নিতে। সরিয়ো না। পড়ে থাকতে থাকতেই ওরা শক্ত হয়। অপেক্ষাটুকুই আসল কৌশল।"></p>
      <blockquote class="story-quote" data-en="Soft when they&rsquo;re warm, perfect when they&rsquo;re patient." data-bn="গরমে নরম, ধৈর্যে নিখুঁত।"></blockquote>
    </div>
</div>

<div class="recipe-split">
<aside class="ing-panel">
<div class="block">
      <span class="label" data-en="you'll need" data-bn="যা যা লাগবে"></span>
      <h2 data-en="Ingredients" data-bn="উপকরণ"></h2>
      <ul class="ingredients">
        <li data-en="60g butter, at room temperature" data-bn="মাখন — ৬০ গ্রাম, ঘরের তাপমাত্রায়"></li>
        <li data-en="100g sugar" data-bn="চিনি — ১০০ গ্রাম"></li>
        <li data-en="A knife-tip of vanilla paste (or a little vanilla sugar)" data-bn="ছুরির ডগায় একটুখানি ভ্যানিলা পেস্ট (বা সামান্য ভ্যানিলা চিনি)"></li>
        <li data-en="30ml milk" data-bn="দুধ — ৩০ মিলি"></li>
        <li data-en="90g all-purpose flour" data-bn="ময়দা — ৯০ গ্রাম"></li>
        <li data-en="30g unsweetened cocoa powder" data-bn="কোকো পাউডার (মিষ্টি ছাড়া) — ৩০ গ্রাম"></li>
        <li data-en="1 tsp cornflour" data-bn="কর্নফ্লাওয়ার — ১ চা-চামচ"></li>
        <li data-en="4g baking powder" data-bn="বেকিং পাউডার — ৪ গ্রাম"></li>
        <li data-en="4g baking soda" data-bn="বেকিং সোডা — ৪ গ্রাম"></li>
        <li data-en="A pinch of salt" data-bn="এক চিমটি নুন"></li>
        <li data-en="75g dark chocolate, for the dough" data-bn="ডার্ক চকোলেট — ৭৫ গ্রাম, ব্যাটারের জন্য"></li>
        <li data-en="50g dark chocolate, for the top" data-bn="ডার্ক চকোলেট — ৫০ গ্রাম, উপরে ছড়ানোর জন্য"></li>
      </ul>
    </div>
</aside>
<div class="recipe-flow">
<div class="block">
      <span class="label" data-en="how to" data-bn="যেভাবে"></span>
      <h2 data-en="The recipe" data-bn="রেসিপি"></h2>
      <ol class="steps">
        <li data-en="Heat the oven to 180°C (top and bottom heat, no fan)." data-bn="ওভেন ১৮০° সেলসিয়াসে গরম করে নাও (উপর-নিচে তাপ, ফ্যান নয়)।"></li>
        <li data-en="Cream the 60g soft butter with the 100g sugar, the vanilla, and the 30ml milk until it&rsquo;s light and fluffy." data-bn="৬০ গ্রাম নরম মাখন, ১০০ গ্রাম চিনি, ভ্যানিলা আর ৩০ মিলি দুধ একসঙ্গে ফেটাও — হালকা, ফুরফুরে না হওয়া পর্যন্ত।"></li>
        <li data-en="In a separate bowl, sift together the 90g flour, 30g cocoa, 1 tsp cornflour, 4g baking powder, 4g baking soda, and a pinch of salt. Sifting matters most for the cocoa and the baking powder. Whisk until evenly mixed." data-bn="আলাদা একটা বাটিতে ৯০ গ্রাম ময়দা, ৩০ গ্রাম কোকো, ১ চা-চামচ কর্নফ্লাওয়ার, ৪ গ্রাম বেকিং পাউডার, ৪ গ্রাম বেকিং সোডা আর এক চিমটি নুন একসঙ্গে চেলে নাও। কোকো আর বেকিং পাউডারের জন্য চালাটা সবচেয়ে জরুরি। তারপর ভালো করে মিশিয়ে নাও।"></li>
        <li data-en="Add the dry mix to the butter mixture and bring it together into a smooth dough. Chop the 75g dark chocolate and fold it through." data-bn="শুকনো মিশ্রণটা মাখনের মিশ্রণে দাও, আর মিশিয়ে একটা মসৃণ ডো বানাও। ৭৫ গ্রাম ডার্ক চকোলেট কুচিয়ে তার মধ্যে মিশিয়ে দাও।"></li>
        <li data-en="Roll the dough into about 10 balls, somewhere between table-tennis and walnut size. Space them well apart on a lined tray — no more than 10 to a tray. Don&rsquo;t flatten them; they spread on their own as they bake." data-bn="ডো থেকে আন্দাজ ১০টা বল গড়ে নাও, টেবিল-টেনিস বল আর আখরোটের মাঝামাঝি মাপের। ট্রেতে বেশ ফাঁক রেখে সাজাও — এক ট্রেতে ১০টার বেশি নয়। চেপে চ্যাপ্টা কোরো না; বেক হওয়ার সময় ওরা নিজেরাই ছড়িয়ে যায়।"></li>
        <li data-en="Bake for about 15 minutes — nearer 13 if you want a soft centre, nearer 17 if you like them crisp. While they bake, chop the 50g chocolate for the top." data-bn="আন্দাজ ১৫ মিনিট বেক করো — নরম ভেতর চাইলে ১৩-এর কাছাকাছি, মুচমুচে পছন্দ হলে ১৭-র দিকে। বেক হওয়ার ফাঁকে উপরে ছড়ানোর ৫০ গ্রাম চকোলেট কুচিয়ে রাখো।"></li>
        <li data-en="Take them out and scatter the chopped chocolate over them straight away, while they&rsquo;re hot — it softens and sets onto the cookies. Then leave them to cool on the tray. They only firm up as they cool, so be patient — this is the one step that matters most." data-bn="বের করেই গরম থাকতে থাকতে উপরে কুচোনো চকোলেট ছড়িয়ে দাও — তাপে ওটা একটু গলে কুকির গায়ে বসে যায়। তারপর ট্রেতেই ঠান্ডা হতে দাও। ঠান্ডা হতে হতেই ওরা শক্ত হয়, তাই ধৈর্য ধরো — এই একটা ধাপই সবচেয়ে জরুরি।"></li>
      </ol>
    </div>
<div class="block">
