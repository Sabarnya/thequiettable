      <span class="label" data-en="the story" data-bn="গল্পটা"></span>
      <p data-en="Figs only come good for a few weeks where I live. When they do, the tree in the courtyard behind our building offers more than the neighbours can eat, and bags of them appear quietly on doorsteps." data-bn="আমি যেখানে থাকি, সেখানে ডুমুর ভালো হয় বছরে মোটে কয়েক সপ্তাহ। যখন হয়, আমাদের বাড়ির পেছনের উঠোনের গাছটা প্রতিবেশীদের খাওয়ার চেয়ে ঢের বেশি দেয়—আর চুপিচুপি দরজার সামনে ডুমুরের থলি এসে হাজির হয়।"></p>
      <p data-en="This tart is what I make with the bag that ends up at mine. Honey from the market, a little mascarpone if there is any, and the figs left mostly to themselves." data-bn="যে থলিটা আমার কাছে এসে পৌঁছোয়, তা দিয়েই বানাই এই টার্ট। বাজারের মধু, থাকলে একটু মাসকারপোনে, আর ডুমুরগুলো বেশিরভাগটাই নিজের মতো থাকতে দেওয়া।"></p>
    </div>
<div class="block">

      <ol class="steps">
        <li data-en="Pulse flour, butter, icing sugar, and a pinch of salt to crumbs. Add the yolk and a splash of cold water; bring together. Chill 30 min." data-bn="ময়দা, মাখন, আইসিং সুগার আর এক চিমটি নুন একসঙ্গে গুঁড়ো করে নিন। কুসুম আর সামান্য ঠান্ডা জল দিয়ে মেখে নিন। ৩০ মিনিট ঠান্ডা করুন।"></li>
        <li data-en="Roll out and line a 24cm tart tin. Blind bake at 180°C for 20 minutes, then 8 more uncovered. Cool." data-bn="বেলে নিয়ে ২৪ সেমি টার্ট টিনে বিছিয়ে দিন। ১৮০°সে-তে ২০ মিনিট ব্লাইন্ড বেক করুন, তারপর ঢাকা খুলে আরও ৮ মিনিট। ঠান্ডা করুন।"></li>
        <li data-en="Whip mascarpone with the honey and spread into the shell." data-bn="মাসকারপোনে মধুর সঙ্গে ফেটিয়ে ক্রাস্টের ভেতরে ছড়িয়ে দিন।"></li>
        <li data-en="Arrange the figs cut-side up, drizzle with more honey, and scatter with torn sage." data-bn="ডুমুরগুলো কাটা-দিক উপরে সাজিয়ে দিন, আরও মধু ছড়িয়ে দিন, আর ছেঁড়া সেজ পাতা ছিটিয়ে দিন।"></li>
      </ol>
