    <h1 data-en="Coconut Cookies" data-bn="নারকেল কুকিজ"></h1>
    <p class="lede" data-en="Every Bengali childhood has a coconut in it. This one just learned to bake." data-bn="প্রতিটা বাঙালি শৈশবে নারকেল আছে, এবার শুধু সেটা বেক হতে শিখেছে।"></p>
    <div class="meta">
      <div class="row"><span class="k" data-en="time" data-bn="সময়"></span><span class="v" data-en="· 30 min" data-bn="· ৩০ মিনিট"></span></div>
      <div class="row"><span class="k" data-en="makes" data-bn="বানায়"></span><span class="v" data-en="· about 24 cookies" data-bn="· ২৪টার মতো কুকি"></span></div>

</div>

  <div class="recipe-hero"><img src="../assets/recipe-coconut-cookies.webp" alt="A plate of golden, craggy coconut cookies, crisp at the edges, on a pale stoneware plate" width="1200" height="900" loading="eager" fetchpriority="high" decoding="async" /></div>

  <div class="article-body">
<div class="recipe-intro">
<div class="block">
      <span class="label" data-en="the story" data-bn="গল্পটা"></span>
      <p data-en="Let&rsquo;s begin this one by spreading bijaya greetings. Shubho Bijaya to everyone who has found their way to me through this little website — may you and your family be kept in great health and happiness." data-bn="আজকের লেখাটা শুরু করা যাক বিজয়ার শুভেচ্ছা দিয়ে। শুভ বিজয়া সবাইকে, যারা এই পেজ বা ওয়েবসাইট দিয়ে আমার সাথে যুক্ত হয়েছেন। সবাইকে মা ভালো রাখুন, এই আশা করি।"></p>
      <p data-en="Long before I knew what a cookie was, I knew নারকেল নাড়ু — the coconut sweets my grandmother rolled in her palms every Lakshmi Puja, warm, a little uneven, smelling of her kitchen and the whole festival at once. I don&rsquo;t have her hands. But I have an oven, and the same bag of coconut, and an afternoon that felt quiet enough to try. These cookies are what happened — crisp at the edge, chewy in the middle, and underneath all the butter and sugar, that one taste I&rsquo;d know anywhere. Not her naru. But a cousin of it. A way of keeping the smell in the house a little longer." data-bn="কুকি জিনিসটা কী, এটা জানার অনেক আগে আমি চিনতাম নারকেল নাড়ু — প্রতি লক্ষ্মীপুজোয় ঠাকুমা যেটা হাতের তালুতে পাকিয়ে বানাতেন, গরম, একটু এবড়োখেবড়ো, গন্ধে তাঁর রান্নাঘর আর গোটা পুজোটা একসাথে মিশে থাকত। তাঁর হাত আমার সাথে নেই; কিন্তু একটা ওভেন তো আছে, নারকেল আছে, আর একটা দুপুর আছে যেটা সেই স্বাদ উস্কে দেওয়ার মতোই শান্ত। এই কুকিগুলো সেই চেষ্টারই ফল — ধারে মুচমুচে, মাঝে নরম, আর এত মাখন-চিনির নিচেও সেই এক স্বাদ, যেটা আমি যেকোনো জায়গা থেকেই ঠিক চিনে নেব। তাঁর বানানো নাড়ু নয় বটে, কিন্তু তার জ্ঞাতিভাই। তাই সেই গন্ধটাকেই ঘরে আরেকটু বেশিক্ষণ ধরে রাখার একটা চেষ্টা মাত্র।"></p>
      <blockquote class="story-quote" data-en="&ldquo;Every Bengali childhood has a coconut in it. This one just learned to bake.&rdquo;" data-bn="&ldquo;প্রতিটা বাঙালি শৈশবে নারকেল আছে, এবার শুধু সেটা বেক হতে শিখেছে।&rdquo;"></blockquote>
    </div>
</div>

<div class="recipe-split">
<aside class="ing-panel">
<div class="block">
      <span class="label" data-en="you'll need" data-bn="যা যা লাগবে"></span>
      <h2 data-en="Ingredients" data-bn="উপকরণ"></h2>
      <ul class="ingredients">
        <li data-en="2 cups (240g) all-purpose flour" data-bn="২ কাপ (২৪০ গ্রাম) ময়দা"></li>
        <li data-en="½ tsp salt" data-bn="আধ চা-চামচ নুন"></li>
        <li data-en="1 tsp baking soda" data-bn="১ চা-চামচ বেকিং সোডা"></li>
        <li data-en="¾ cup (170g) unsalted butter, softened" data-bn="¾ কাপ (১৭০ গ্রাম) নরম বাটার"></li>
        <li data-en="½ cup (110g) light brown sugar" data-bn="আধ কাপ (১১০ গ্রাম) ব্রাউন সুগার"></li>
        <li data-en="½ cup (100g) granulated sugar" data-bn="আধ কাপ (১০০ গ্রাম) চিনি"></li>
        <li data-en="1 large egg" data-bn="১টা বড় ডিম"></li>
        <li data-en="1 tsp vanilla extract" data-bn="১ চা-চামচ ভ্যানিলা এসেন্স"></li>
        <li data-en="1¾ cups (150g) shredded sweetened coconut" data-bn="১¾ কাপ (১৫০ গ্রাম) মিষ্টি নারকেল কোরা"></li>
      </ul>
    </div>
</aside>
<div class="recipe-flow">
<div class="block">
      <span class="label" data-en="how to" data-bn="যেভাবে"></span>
      <h2 data-en="The recipe" data-bn="রেসিপি"></h2>
            <ol class="steps">
        <li data-en="Heat the oven to 350°F (175°C) and line two baking sheets with parchment." data-bn="ওভেন ১৭৫°সে (৩৫০°ফা)-তে গরম করো। দুটো বেকিং ট্রে-তে পার্চমেন্ট পেপার বিছিয়ে নাও।"></li>
        <li data-en="In a bowl, whisk together the flour, salt and baking soda." data-bn="একটা বাটিতে ময়দা, নুন আর বেকিং সোডা একসাথে ফেটিয়ে নাও।"></li>
        <li data-en="Beat the butter and both sugars on medium for about 3 minutes, until light and fluffy." data-bn="বাটার আর দু-রকম চিনি মাঝারি স্পিডে মিনিট তিনেক ফেটাও, যতক্ষণ না হালকা আর ফুরফুরে হয়।"></li>
        <li data-en="Add the egg and vanilla, mix on low, scrape the bowl, and mix again." data-bn="ডিম আর ভ্যানিলা দাও, কম স্পিডে মেশাও, বাটির গা চেঁছে আবার মেশাও।"></li>
        <li data-en="Add the flour mixture and mix until almost combined. Scrape, add the coconut, and mix on low until just combined." data-bn="ময়দার মিশ্রণ দাও, প্রায় মিশে যাওয়া পর্যন্ত মেশাও। বাটি চেঁছে নারকেল কোরা দাও, কম স্পিডে অল্প মিশিয়ে থেমে যাও।"></li>
        <li data-en="Scoop into 2-tablespoon (32g) balls and place them about two inches apart." data-bn="২ টেবিল-চামচ (৩২ গ্রাম) করে ডো নিয়ে বল পাকাও, ট্রে-তে দু-ইঞ্চি দূরত্বে রাখো।"></li>
        <li data-en="Bake 10–12 minutes, until the edges are lightly golden and set and the tops look dry." data-bn="১০–১২ মিনিট বেক করো, যতক্ষণ না ধারগুলো হালকা সোনালি আর সেট হয়, উপরটা শুকনো দেখায়।"></li>
        <li data-en="Cool on the sheet for 5 minutes, then move to a wire rack to cool completely." data-bn="ট্রে-তেই ৫ মিনিট রাখো, তারপর তারের র‍্যাকে তুলে পুরো ঠান্ডা করো।"></li>
      </ol>
    </div>
</div>
</div>

<div class="recipe-outro">
<div class="block">
      <span class="label" data-en="before you go" data-bn="যাওয়ার আগে"></span>
      <p data-en="A few small notes, learned the slow way:" data-bn="কয়েকটা ছোট্ট কথা, ধীরে ধীরে শেখা:"></p>
      <ul class="ingredients">
        <li data-en="For softer cookies, swap 1 tablespoon of flour for 1 tablespoon of cornstarch." data-bn="নরম কুকি চাইলে ১ টেবিল-চামচ ময়দার বদলে ১ টেবিল-চামচ কর্নফ্লাওয়ার দাও।"></li>
        <li data-en="Weigh the flour if you can — too much is what makes a cookie dry." data-bn="পারলে ময়দা মেপে নাও — বেশি ময়দাই কুকি শুকনো করে দেয়।"></li>
        <li data-en="Let the butter and egg come to room temperature first." data-bn="বাটার আর ডিম আগে ঘরের তাপমাত্রায় আসতে দাও।"></li>
        <li data-en="Use sweetened shredded coconut — not desiccated or unsweetened." data-bn="মিষ্টি নারকেল কোরা ব্যবহার করো — শুকনো বা মিষ্টিহীন নয়।"></li>
        <li data-en="Want it toasty? Use 2 cups toasted coconut, cooled before mixing in." data-bn="ভাজা স্বাদ চাইলে ২ কাপ ভাজা নারকেল নাও, মেশানোর আগে ঠান্ডা করে নিয়ো।"></li>
      </ul>
      <p data-en="If you bake these, send me a photo — I&rsquo;d love to see your version on your table. Shubho Bijaya, once more. ❤️" data-bn="যদি বানিয়ে ফেলো, তাহলে একটা ছবি পাঠিয়ো — তোমার টেবিলে এরা কেমন দেখতে হলো, জানতে খুব ইচ্ছে থাকল। আরও একবার, শুভ বিজয়া। ❤️"></p>
      <p class="ig-note" data-en="For more tips, small tweaks, and the exact ingredients I use, come find me on Instagram <a href=&quot;https://www.instagram.com/the.quiet.table_07/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;>@the.quiet.table_07</a> — ask me anything." data-bn="আরও কিছু টিপস, ছোটখাটো কায়দা আর আমি যেসব উপকরণ ব্যবহার করি — সব জানতে ইনস্টাগ্রামে চলে এসো <a href=&quot;https://www.instagram.com/the.quiet.table_07/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;>@the.quiet.table_07</a>-তে। নির্দ্বিধায় জিজ্ঞেস কোরো।"></p>

<script>
  function setLang(lang){
    document.body.classList.toggle('bn', lang === 'bn');
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(function(el){
      var t = el.getAttribute('data-' + lang);
      if (t !== null) el.innerHTML = t;
    });
    document.querySelectorAll('.lang-toggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.set === lang);
    });
  }
  document.querySelectorAll('.lang-toggle button').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.set); });
  });
  setLang('en');
</script>
