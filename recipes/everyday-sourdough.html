      <p data-en="I named my starter Pearl. She lives in a jar on the counter and she has opinions about the weather." data-bn="আমার স্টার্টারের নাম রেখেছি পার্ল। সে থাকে রান্নাঘরের তাকে একটা জারে, আর আবহাওয়া নিয়ে তার নিজস্ব মত আছে।"></p>
      <p data-en="After a year of arguing with her, we reached an understanding: I mix the dough on Friday night, I forget about it until Saturday afternoon, and she rewards me with a crust that crackles when it cools." data-bn="এক বছর তার সঙ্গে তর্ক করার পর আমরা একটা বোঝাপড়ায় পৌঁছেছি: আমি শুক্রবার রাতে ময়দা মেখে রাখি, শনিবার বিকেল পর্যন্ত ভুলে থাকি, আর সে আমাকে এমন এক ক্রাস্ট উপহার দেয় যা ঠান্ডা হওয়ার সময় মুচমুচ করে।"></p>
    </div>

      <ol class="steps">
        <li data-en="Mix flour and water until no dry spots remain. Rest 1 hour (autolyse)." data-bn="ময়দা আর জল মিশিয়ে নিন, যেন কোনো শুকনো জায়গা না থাকে। ১ ঘণ্টা রেখে দিন (অটোলাইজ)।"></li>
        <li data-en="Add the starter and salt. Pinch and fold until incorporated." data-bn="স্টার্টার আর নুন দিন। চিমটে আর ভাঁজ করে ভালো করে মিশিয়ে নিন।"></li>
        <li data-en="Over the next 3 hours, do four sets of stretch-and-folds, 30 minutes apart." data-bn="পরের ৩ ঘণ্টায় ৩০ মিনিট অন্তর চার দফা স্ট্রেচ-অ্যান্ড-ফোল্ড করুন।"></li>
        <li data-en="Shape into a tight round, place seam-up in a floured banneton, and refrigerate overnight." data-bn="টান টান করে গোল আকার দিন, ময়দা মাখানো ব্যানেটনে সেলাই-দিক উপরে রেখে সারারাত ফ্রিজে রাখুন।"></li>
        <li data-en="Bake the next morning in a preheated Dutch oven at 240°C: 20 minutes covered, 20 minutes uncovered. Cool fully on a rack before slicing." data-bn="পরদিন সকালে আগে থেকে গরম করা ডাচ ওভেনে ২৪০°সে-তে সেঁকুন: ২০ মিনিট ঢাকা দিয়ে, ২০ মিনিট ঢাকা খুলে। কাটার আগে র‍্যাকে পুরোপুরি ঠান্ডা করুন।"></li>
