    { "@type": "HowToStep", "text": "Line two baking sheets with macaron template mats and wipe them with white vinegar to remove moisture, dust, or grease." },

    { "@type": "HowToStep", "text": "Add food colouring and extract if using, mix on medium 1 to 2 minutes, then whip on high 30 seconds to stiff, upright peaks." },
    { "@type": "HowToStep", "text": "Sift the almond mixture into the meringue and fold firmly, about 60-70 folds, until the batter ribbons back into itself in about 10 seconds and draws an unbroken figure-8 from the spatula." },
    { "@type": "HowToStep", "text": "Pipe rounds onto the mats with a round tip." },
    { "@type": "HowToStep", "text": "Drop the trays flat onto a towel 6 to 8 times to release air bubbles, then rest 30-45 minutes until the tops are dry to the touch." },
    { "@type": "HowToStep", "text": "Bake one tray at a time at 275°F (135°C) for 23 minutes, rotating halfway. Cool completely on the mats before lifting." },
    { "@type": "HowToStep", "text": "Beat the 200g cold cream cheese until light, then add 40g powdered sugar, 1 tsp vanilla, a pinch of salt and colouring; beat low then high 3 to 4 minutes until smooth." },
    { "@type": "HowToStep", "text": "Match shells by size, pipe filling around the edge of one, sandwich with its partner, and chill 24 hours before serving." }

    <h1 data-en="Macaron" data-bn="ম্যাকারন"></h1>
    <p class="lede" data-en="Two almond disks and a whisper of cream — how can something so small hold so many ways to fail?" data-bn="দুটো বাদামের চাকতি, মাঝে একটুখানি ক্রিম — এত ছোট্ট একটা জিনিস, অথচ ভুল হওয়ার কত যে পথ লুকিয়ে রাখে!"></p>
    <div class="meta">
      <div class="row"><span class="k" data-en="time" data-bn="সময়"></span><span class="v" data-en="· 1 hr + resting" data-bn="· ১ ঘণ্টা + বিশ্রাম"></span></div>
      <div class="row"><span class="k" data-en="makes" data-bn="পরিমাণ"></span><span class="v" data-en="· 20" data-bn="· ২০টি"></span></div>
    </div>
      <button class="cook-start btn btn-solid" data-en="Cook this — step by step →" data-bn="রান্না করুন — ধাপে ধাপে →"></button>
</div>

  <div class="recipe-hero"><img src="../assets/recipe-macaron.webp" alt="Macaron shells with violet cream cheese filling on a white plate" width="1200" height="900" loading="eager" fetchpriority="high" decoding="async" /></div>

  <div class="article-body">
<div class="recipe-intro">
<div class="block">
      <span class="label" data-en="the story" data-bn="গল্পটা"></span>
      <p data-en="Curious why that first failure happened at all? Here's the answer: the macaron." data-bn="আচ্ছা, জানতে ইচ্ছে হয়নি — আগের রেসিপিতে যে ব্যর্থতার কথা বলেছিলাম, সেটা আসলে কী থেকে হয়েছিল? উত্তরটা এই — ম্যাকারন।"></p>
      <p data-en="Macarons don&rsquo;t care what you feel. They care what you weigh. I cook by instinct — a little more of this, a pinch of that. My first recipe was about trusting yourself over the numbers. The macaron refused. Every gram counted. Every fold. I measured, I counted, I obeyed — and the shells came out perfect." data-bn="ম্যাকারন তোমার মনের কথা জানতে চায় না। তার কাছে গুরুত্বপূর্ণ একটাই জিনিস — পরিমাপ। আমি রাঁধি অনুভব দিয়ে; একটু বেশি এটা, এক চিমটি ওটা। আমার কাছে রেসিপি মানে ছিল সংখ্যার চেয়ে নিজেকে বেশি বিশ্বাস করা। কিন্তু ম্যাকারন সে কথা মানল না। প্রতিটা গ্রাম গুনলাম, প্রতিটা ভাঁজ গুনলাম — মেপে মেপে, গুনে গুনে। আর খোলস বেরোল একদম নিখুঁত।"></p>
      <p data-en="Then the buttercream split. Precision couldn&rsquo;t save it — a degree too cold and it breaks anyway. So I stopped measuring. I whipped cold Philadelphia light and barely sweet, by feel, and filled them with that instead." data-bn="কিন্তু বাটারক্রিম? সেটা তো হলোই না। নিখুঁত হওয়া কিছুই তাকে বাঁচাতে পারল না — এক ডিগ্রি বেশি ঠান্ডা হলেই শেষ। তখন মাপা বন্ধ করে দিলাম। ঠান্ডা ফিলাডেলফিয়া ক্রিম চিজ — হালকা, সামান্য মিষ্টি, ঠিক মনের ডাকে ফেটিয়ে — তা-ই ভরে দিলাম ভেতরে।"></p>
      <blockquote class="story-quote" data-en="The shells were precision. The rescue was instinct. Turns out you need both — and a good cook knows which the moment is asking for." data-bn="খোলসটা ছিল নিখুঁততা। ভেতরটা ছিল সহজাত বোধ, পেটের ইশারা। শেষে দুটোই লাগে — আর ভালো রাঁধুনি শুধু এটুকুই জানে, কোন মুহূর্তে কোনটা দরকার।"></blockquote>
      <p data-en="A quiet note before you begin: this is the opposite of my first recipe. There&rsquo;s no &lsquo;a little more,&rsquo; no &lsquo;until it looks right.&rsquo; The macaron asks for grams and seconds and your full attention — so weigh everything, count your folds, and trust the numbers over your instinct. Save the instinct for the filling." data-bn="শুরুর আগে ছোট্ট একটা কথা — এই রেসিপিটা আমার প্রথম রেসিপির একেবারে উল্টো। এখানে &lsquo;একটু বেশি দিয়ে দাও&rsquo; বলে কিছু নেই, &lsquo;দেখে মনে হচ্ছে হয়ে গেছে&rsquo; বলেও কিছু নেই। ম্যাকারন চায় মেপে দেওয়া গ্রাম, চায় গোনা সেকেন্ড, চায় তোমার পুরো মনটা। তাই এবার মন নয়, মাপকেই ভরসা করো — সব ওজন করে নাও, ভাঁজ গুনে গুনে দাও। আর মন দিয়ে রান্নার অভ্যেসটা তুলে রাখো ফিলিং-এর জন্য।"></p>
    </div>
</div>

<div class="recipe-split">

      <h2 data-en="Ingredients" data-bn="উপকরণ"></h2>
      <ul class="ingredients">
        <li data-en="105g egg whites, aged (see step 1)" data-bn="ডিমের সাদা অংশ — ১০৫ গ্রাম, পুরনো করে নেওয়া (ধাপ ১ দেখো)"></li>
        <li data-en="144g almond flour" data-bn="বাদামের গুঁড়ো — ১৪৪ গ্রাম"></li>
        <li data-en="125g powdered sugar" data-bn="চিনির গুঁড়ো — ১২৫ গ্রাম"></li>
        <li data-en="105g granulated sugar" data-bn="দানা চিনি — ১০৫ গ্রাম"></li>
        <li data-en="Powdered food colouring — ¾ tsp pink or 1 tsp green (I used pink)" data-bn="গুঁড়ো ফুড কালার — গোলাপি ¾ চা-চামচ বা সবুজ ১ চা-চামচ (আমি গোলাপি দিয়েছি)"></li>
        <li data-en="Optional: 2–3 drops flavoured extract (blueberry or raspberry)" data-bn="ইচ্ছে হলে — ২-৩ ফোঁটা ফ্লেভার এসেন্স (ব্লুবেরি বা রাস্পবেরি)"></li>
        <li data-en="200g Philadelphia cream cheese, cold" data-bn="ফিলাডেলফিয়া ক্রিম চিজ — ২০০ গ্রাম, ফ্রিজ-ঠান্ডা"></li>
        <li data-en="40g powdered sugar (adjust to taste)" data-bn="চিনির গুঁড়ো — ৪০ গ্রাম (স্বাদ বুঝে)"></li>
        <li data-en="1 tsp vanilla extract" data-bn="ভ্যানিলা এসেন্স — ১ চা-চামচ"></li>
        <li data-en="A pinch of salt" data-bn="এক চিমটি নুন"></li>
        <li data-en="A little food colouring (I used violet)" data-bn="সামান্য ফুড কালার (আমি বেগুনি দিয়েছি)"></li>
      </ul>
    </div>
</aside>
<div class="recipe-flow">
<div class="block">
      <span class="label" data-en="how to" data-bn="যেভাবে"></span>
      <h2 data-en="The recipe" data-bn="রেসিপি"></h2>
      <ol class="steps">
        <li data-en="Age the egg whites. Separate four eggs, dropping the whites into a clean bowl. Cover loosely and leave at room temperature for 24 hours. In a hurry? Microwave fresh whites in 5-second bursts, up to 15 seconds total, to gently dry them. Either way, weigh out exactly 105g afterwards." data-bn="আগে ডিমের সাদা অংশটা পুরনো করে নাও। চারটে ডিম ভেঙে সাদা অংশটুকু একটা পরিষ্কার বাটিতে রাখো। আলগা করে ঢাকা দিয়ে ঘরের তাপমাত্রায় ২৪ ঘণ্টা ফেলে রাখো। সময় নেই? টাটকা সাদা অংশটাই মাইক্রোওয়েভে ৫ সেকেন্ড করে গরম করো, বড়জোর ১৫ সেকেন্ড — আস্তে আস্তে শুকিয়ে নেওয়ার জন্য। যেভাবেই করো, শেষে ঠিক ১০৫ গ্রাম মেপে নিতে ভুলো না।"></li>
        <li data-en="Prepare the trays. Line two baking sheets with macaron template mats, then wipe the mats with white vinegar to lift away any moisture, dust, or grease. Macarons hate all three." data-bn="ট্রে গুছিয়ে নাও। দুটো বেকিং ট্রেতে ম্যাকারনের সিলিকন ম্যাট বা টেমপ্লেট কাগজ পেতে নাও। তারপর ম্যাটগুলো সাদা ভিনিগার দিয়ে ভালো করে মুছে নাও — এক ফোঁটা জল, এক কণা ধুলো বা সামান্য তেলচিটে ভাব যেন না থাকে। এই তিনটে জিনিস ম্যাকারন সহ্য করতে পারে না।"></li>
        <li data-en="Sift twice. Sift the 144g almond flour with the 125g powdered sugar, twice. Set aside." data-bn="দু'বার চেলে নাও। বাদামের গুঁড়ো (১৪৪ গ্রাম) আর চিনির গুঁড়ো (১২৫ গ্রাম) একসঙ্গে দু'বার চেলে নাও। পাশে সরিয়ে রাখো।"></li>
        <li data-en="Start the meringue. Wipe your mixer bowl and whisk with vinegar too. Add the 105g egg whites and beat on medium until foamy, about 1 minute." data-bn="মেরাং শুরু করো। মিক্সারের বাটি আর ফেটানোর হুইস্কটাও ভিনিগার দিয়ে মুছে নাও। ১০৫ গ্রাম সাদা অংশ দিয়ে মাঝারি গতিতে ফেটাতে থাকো, মিনিটখানেক — যতক্ষণ না হালকা ফেনা ওঠে।"></li>
        <li data-en="Build it. Add the 105g granulated sugar a little at a time, raise to medium-high, and beat to stiff, glossy peaks — about 5 to 7 minutes." data-bn="ধীরে ধীরে গড়ে তোলো। দানা চিনিটা (১০৫ গ্রাম) অল্প অল্প করে মেশাও, গতি বাড়িয়ে মাঝারি-জোরে নাও। ফেটাতে থাকো যতক্ষণ না শক্ত, চকচকে চূড়া তৈরি হয় — মোটামুটি ৫ থেকে ৭ মিনিট।"></li>
        <li data-en="Colour and flavour. Add the food colouring and extract if using, and mix on medium for 1 to 2 minutes until even. Then whip on high for a final 30 seconds — the meringue should stand in stiff peaks that point straight up." data-bn="রং আর গন্ধ। ফুড কালার আর এসেন্স (দিলে) মিশিয়ে নাও, মাঝারি গতিতে মিনিট এক-দুই। তারপর জোর গতিতে আরও ৩০ সেকেন্ড। মেরাং এমন শক্ত হবে যে চূড়াটা টান-টান হয়ে সোজা দাঁড়িয়ে থাকে।"></li>
        <li data-en="Fold — the moment that matters. Sift the almond mixture straight into the meringue. With a spatula, fold firmly, about 60–70 folds, until the batter flows like thick lava and ribbons back into itself within roughly 10 seconds. &lsquo;Like lava&rsquo; is vague, so here&rsquo;s the real test: lift the spatula and try to draw a figure-8 with the falling batter. If it flows in one unbroken 8, it&rsquo;s perfect." data-bn="ভাঁজ — এইটুকুই আসল খেলা। বাদামের মিশ্রণটা মেরাং-এর উপর চেলে দাও। স্প্যাচুলা দিয়ে চেপে চেপে ভাঁজতে থাকো, মোটামুটি ৬০ থেকে ৭০ বার — যতক্ষণ না ব্যাটার গাঢ় লাভার মতো গড়িয়ে পড়ে আর সেকেন্ড দশেকের মধ্যে নিজের মধ্যে মিলিয়ে যায়। &lsquo;লাভার মতো&rsquo; কথাটা একটু ধোঁয়াশা, তাই সহজ পরীক্ষাটা বলি — স্প্যাচুলা তুলে গড়িয়ে-পড়া ব্যাটার দিয়ে বাতাসে একটা ৮ আঁকার চেষ্টা করো। কোথাও না ভেঙে একটানা সুন্দর ৮ হলে বুঝবে ব্যাটার তৈরি।"></li>
        <li data-en="Pipe. Transfer to a piping bag with a round tip and pipe your shells onto the mats. Neat shells take practice — don&rsquo;t be discouraged on the first tray. You&rsquo;ll find the rhythm." data-bn="পাইপ করো। গোল নজল লাগানো পাইপিং ব্যাগে ব্যাটার ভরে ম্যাটের উপর একটা একটা করে খোলস পাইপ করো। সাফসুতরো খোলস পাইপ করতে একটু হাত পাকাতে হয় — প্রথম ট্রেতে এলোমেলো হলে মন খারাপ কোরো না। কয়েকটা করতে করতেই ছন্দ চলে আসবে।"></li>
        <li data-en="Rest. Drop the trays flat onto a towel 6 to 8 times to knock out air bubbles. Then rest 30–45 minutes, until the tops are dry to the touch — this is what gives them their feet." data-bn="একটু জিরিয়ে নিতে দাও। ট্রেগুলো একটা তোয়ালের উপর সমান করে ৬-৮ বার ঠুকে দাও, যাতে ভেতরের বাতাসের বুদবুদ বেরিয়ে যায়। তারপর ৩০-৪৫ মিনিট এমনিই ফেলে রাখো, যতক্ষণ না উপরটা ছুঁলে হাতে লাগে না। এই শুকিয়ে ওঠাটুকুই খোলসের নিচে সুন্দর পায়া তৈরি করে।"></li>
        <li data-en="Bake. One tray at a time at 275°F (135°C) for 23 minutes, rotating halfway. Let the shells cool completely on the mats before you lift them off." data-bn="বেক করো। একবারে একটা করে ট্রে — ২৭৫°F (১৩৫°C) তাপে ২৩ মিনিট, মাঝপথে একবার ট্রেটা ঘুরিয়ে দিয়ো। বেক হয়ে গেলে ম্যাটের উপরেই পুরোপুরি ঠান্ডা হতে দাও, তারপর আলতো করে তুলো।"></li>
        <li data-en="Make the filling. Beat the 200g cold cream cheese until light and creamy. Add the 40g powdered sugar, 1 tsp vanilla, a pinch of salt, and colouring; beat on low until combined, then high for 3 to 4 minutes until smooth." data-bn="ফিলিং বানাও। ঠান্ডা ক্রিম চিজটা (২০০ গ্রাম) হালকা আর ক্রিমি হওয়া পর্যন্ত ফেটিয়ে নাও। তারপর চিনির গুঁড়ো (৪০ গ্রাম), ভ্যানিলা (১ চা-চামচ), এক চিমটি নুন আর সামান্য রং মিশিয়ে দাও। প্রথমে অল্প গতিতে, তারপর জোর গতিতে ৩-৪ মিনিট মসৃণ, নরম হওয়া পর্যন্ত।"></li>
        <li data-en="Assemble and wait. Match shells by size. Pipe filling around the edge of one shell — add a dot of jam in the centre if you like — and gently sandwich with its partner. Then the hardest step: chill the assembled macarons for 24 hours before serving. The shells soften from within and the flavour settles. They&rsquo;re worth the wait." data-bn="জোড়া বেঁধে অপেক্ষা করো। আকার মিলিয়ে খোলসের জোড়া বেছে নাও। একটা খোলসের কিনারা ঘেঁষে ফিলিং পাইপ করো — ইচ্ছে হলে মাঝখানে এক ফোঁটা জ্যাম দাও — তারপর তার জোড়া আলতো করে চেপে বসাও। আর এবার সবচেয়ে কঠিন ধাপ: জোড়া-বাঁধা ম্যাকারন ২৪ ঘণ্টা ফ্রিজে রেখে তবেই পরিবেশন কোরো। এই সময়টুকুতেই খোলস ভেতর থেকে নরম হয়, স্বাদ মিলেমিশে যায়। বিশ্বাস করো, এটুকু অপেক্ষা ম্যাকারন ষোলো আনা ফেরত দেয়।"></li>
      </ol>

<script>
  function setLang(lang){
    document.body.classList.toggle('bn', lang === 'bn');
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(function(el){
      var t = el.getAttribute('data-' + lang);
      if (t !== null) el.innerHTML = t;
    });
    document.querySelectorAll('.lang-toggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.set === lang);
    });
  }
  document.querySelectorAll('.lang-toggle button').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.set); });
  });
  setLang('en');
</script>
