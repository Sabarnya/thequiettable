<div class="block">
      <span class="label" data-en="the story" data-bn="গল্পটা"></span>
      <p data-en="You&rsquo;ve baked a cheesecake before, and it was amazing — so this one should be a cake walk. It&rsquo;s the last recipe with one change. But it&rsquo;s still cheesecake, the delicate princess of the culinary world, and she notices every shortcut." data-bn="আগে যে চিজকেকটা বানিয়েছিলে, সেটা দারুণ হয়েছিল, আমি জানি। কাজেই এটা তোমার কাছে জলভাত — না না, কেকভাত! আগের রেসিপিটাই, শুধু একটু বদল। কিন্তু চিজকেক তো, রান্নাঘরের যত নাজুক রাজকন্যা। একটু ফাঁকি দিলেই ঠিক টের পেয়ে যায়।"></p>
      <p data-en="So be creative with the flavour and the story, and make it beautiful. Then get the details exactly right: the weights, the temperatures, the timing, the wobble in the centre. Precision comes first, and the creativity goes on top of it." data-bn="তাই মাথা খাটাও, নতুন কিছু ভাবো, সুন্দর করে সাজাও। তবে মাপ, ওভেনের তাপ, সময়, মাঝখানের সেই হালকা কাঁপুনি — এসব যেন একদম ঠিক থাকে। আগে হিসেব, তারপর বাকি সব।"></p>
      <blockquote class="story-quote" data-en="Pale green, never brown. That&rsquo;s the whole promise." data-bn="ফিকে সবুজ, বাদামি নয়। এইটুকুই কথা দিলাম।"></blockquote>
    </div>
</div>

      <h2 data-en="Ingredients" data-bn="উপকরণ"></h2>
      <ul class="ingredients">
        <li data-en="700g cream cheese (Philadelphia or any kind)" data-bn="ক্রিম চিজ — ৭০০ গ্রাম (ফিলাডেলফিয়া বা যেকোনো)"></li>
        <li data-en="140g sugar" data-bn="চিনি — ১৪০ গ্রাম"></li>
        <li data-en="100g unsalted butter, plus a little for the tin" data-bn="মাখন (লবণ ছাড়া) — ১০০ গ্রাম, সঙ্গে টিনের জন্য একটু"></li>
        <li data-en="3 eggs (medium to large)" data-bn="ডিম — ৩টি (মাঝারি থেকে বড়)"></li>
        <li data-en="12g all-purpose flour" data-bn="ময়দা — ১২ গ্রাম"></li>
        <li data-en="200g heavy cream (over 30% fat)" data-bn="হেভি ক্রিম (৩০%-এর বেশি ফ্যাট) — ২০০ গ্রাম"></li>
        <li data-en="1 pack of biscuits (Leibniz, Lotus Biscoff or similar)" data-bn="বিস্কুট (লাইবনিৎস, লোটাস বিস্কফ বা এই ধরনের) — এক প্যাকেট"></li>
        <li data-en="80g pistachio paste" data-bn="পেস্তা পেস্ট — ৮০ গ্রাম"></li>
        <li data-en="15g unsalted pistachios" data-bn="লবণ ছাড়া পেস্তা — ১৫ গ্রাম"></li>
        <li data-en="1 bar of white chocolate, for the ganache" data-bn="হোয়াইট চকোলেট — ১ বার, গ্যানাশের জন্য"></li>
      </ul>
    </div>
</aside>
<div class="recipe-flow">
<div class="block">
      <span class="label" data-en="how to" data-bn="যেভাবে"></span>
      <h2 data-en="The recipe" data-bn="রেসিপি"></h2>
      <ol class="steps">
        <li data-en="Before you start. Heat the oven to 180°C (top and bottom heat, no fan) at least 30 minutes before you bake. Cheesecake likes a steady, fully heated oven." data-bn="শুরুর আগে। বেক করার অন্তত ৩০ মিনিট আগে ওভেন ১৮০° সেলসিয়াসে গরম করে নাও (উপর-নিচে তাপ, ফ্যান নয়)। চিজকেক ভালোবাসে ঠিকঠাক গরম, স্থির ওভেন।"></li>
        <li data-en="Crush the biscuits in a food processor, or in a bowl with a rolling pin, until no big pieces are left. They should look like breadcrumbs." data-bn="বিস্কুট গুঁড়ো করো — ফুড প্রসেসরে, নয়তো বাটিতে বেলুন দিয়ে। বড় টুকরো যেন না থাকে, ব্রেডক্রাম্বের মতো হওয়া চাই।"></li>
        <li data-en="Chop 7 to 8g of the pistachios and mix them into the crumbs, so you feel them when you bite. Keep the rest for the garnish." data-bn="পেস্তা থেকে ৭ থেকে ৮ গ্রাম কুচিয়ে গুঁড়ো বিস্কুটে মিশিয়ে নাও, যাতে খাওয়ার সময় দাঁতে ঠেকে। বাকিটা সাজানোর জন্য তুলে রাখো।"></li>
        <li data-en="Melt the 100g butter in the microwave or a small saucepan and stir it into the crumbs a little at a time. Add just enough to make the crumbs hold together — they shouldn&rsquo;t turn oily." data-bn="১০০ গ্রাম মাখন মাইক্রোওয়েভে বা ছোট সসপ্যানে গলিয়ে অল্প অল্প করে গুঁড়োয় মেশাও। যতটুকুতে গুঁড়ো একসঙ্গে বাঁধে, ততটুকুই দাও। তেলতেলে হলে চলবে না।"></li>
        <li data-en="Grease a large tin on the bottom and sides with butter, or line it with greaseproof paper, so the cake lifts out cleanly. Tip in the crumbs, spread them evenly, and press down firmly with a spoon, the base of a glass or a rolling pin until the surface is flat and compact." data-bn="একটা বড় টিনের তলা আর ধার মাখন দিয়ে মাখিয়ে নাও, নয়তো বাটার পেপার বিছিয়ে দাও, যাতে কেকটা সহজে বেরিয়ে আসে। গুঁড়ো ঢেলে সমান করে ছড়াও, তারপর চামচ, গ্লাসের তলা বা বেলুন দিয়ে চেপে চেপে সমান, শক্ত একটা তলা বানাও।"></li>
        <li data-en="In a large bowl, whisk the 3 eggs, 200g cream, 12g flour and 140g sugar until smooth." data-bn="একটা বড় বাটিতে ৩টি ডিম, ২০০ গ্রাম ক্রিম, ১২ গ্রাম ময়দা আর ১৪০ গ্রাম চিনি মসৃণ না হওয়া পর্যন্ত ফেটাও।"></li>
        <li data-en="Add the 700g cream cheese and whisk again until the batter is completely smooth and just slightly creamy. Stop there — you&rsquo;re not whipping air into it." data-bn="৭০০ গ্রাম ক্রিম চিজ দিয়ে আবার ফেটাও, যতক্ষণ না ব্যাটার একদম মসৃণ আর একটুখানি ক্রিমি হয়। ওখানেই থামো। হাওয়া ঢুকিয়ো না।"></li>
        <li data-en="Stir in the 80g pistachio paste until the colour is even. Keep a spoonful aside for the ganache. (No paste? Grind extra unsalted pistachios to a fine powder, blend with a little water a teaspoon at a time into a thick paste, then sweeten with a spoon of honey.)" data-bn="এবার ৮০ গ্রাম পেস্তা পেস্ট দিয়ে মেশাও, রং সমান না হওয়া পর্যন্ত। এক চামচ আলাদা করে রেখে দিয়ো, গ্যানাশে লাগবে। (পেস্ট নেই? বাড়তি লবণ ছাড়া পেস্তা মিহি গুঁড়ো করে, একটু একটু জল দিয়ে চা-চামচ ধরে ঘন পেস্ট বানাও, শেষে এক চামচ মধু দিয়ে মিষ্টি করে নাও।)"></li>
        <li data-en="Optional: for a more savoury, tangy cheesecake, grate in a little mature cheese like Parmesan or Grana Padano. Taste it and trust yourself." data-bn="ইচ্ছে হলে: একটু নোনতা, টক-টক স্বাদ চাইলে সামান্য পুরনো চিজ — পারমেজান বা গ্রানা পাদানো — কুরিয়ে দিতে পারো। চেখে দেখো, আর নিজের জিভকে বিশ্বাস করো।"></li>
        <li data-en="Blind-bake the base first. Put the tin on the middle shelf and bake the base alone for 5 minutes, until lightly golden. Pour in the filling and bake for 18 minutes. Turn the oven off and leave the cake inside for 3 to 4 minutes. Watch the top — it shouldn&rsquo;t brown. When you take the cake out, the centre should still wobble like soft jelly; it sets creamy as it cools. If it firms up too fast, switch the oven off a little earlier next time." data-bn="আগে শুধু বেসটা বেক করো। টিনটা মাঝের তাকে বসিয়ে বেস একা ৫ মিনিট বেক করো, হালকা সোনালি না হওয়া পর্যন্ত। তারপর ফিলিং ঢেলে ১৮ মিনিট বেক করো। এবার ওভেন বন্ধ করে কেকটা ভেতরেই ৩ থেকে ৪ মিনিট রেখে দাও। উপরটার দিকে নজর রেখো, ওটা যেন বাদামি না হয়। বের করার সময় মাঝখানটা নরম জেলির মতো কাঁপবে; ঠান্ডা হতে হতে ক্রিমি হয়ে জমে যায়। খুব তাড়াতাড়ি শক্ত হয়ে গেলে পরের বার ওভেনটা আরেকটু আগে বন্ধ কোরো।"></li>
        <li data-en="The hardest part: let the cake cool for 30 minutes to an hour, then put it in the fridge. Bake it the day before if you can — a night in the fridge gives it the dense, settled texture a proper cheesecake has. The waiting is part of the recipe." data-bn="সবচেয়ে কঠিন অংশ: কেকটা আধ ঘণ্টা থেকে এক ঘণ্টা ঠান্ডা হতে দাও, তারপর ফ্রিজে রাখো। পারলে আগের দিন বানিয়ে রাখো। সারারাত ফ্রিজে থাকলে তবেই আসল চিজকেকের সেই গাঢ়, থিতু টেক্সচারটা আসে। এই অপেক্ষাটুকুও রেসিপিরই অংশ।"></li>
        <li data-en="White chocolate ganache (optional topping). Melt the white chocolate in a bowl set over a pan of barely simmering water. Stir in the pistachio paste you saved and taste — white chocolate is very sweet, so a little more paste cuts the sweetness. Spread the ganache over the chilled cake and scatter the reserved chopped pistachios on top." data-bn="হোয়াইট চকোলেট গ্যানাশ (ইচ্ছে হলে, উপরে দেওয়ার জন্য)। একটা পাত্রে হালকা ফুটন্ত জল রাখো, তার ওপর বাটি বসিয়ে হোয়াইট চকোলেট গলাও। তুলে রাখা পেস্তা পেস্ট মিশিয়ে চেখে দেখো — হোয়াইট চকোলেট এমনিতেই খুব মিষ্টি, মিষ্টি বেশি লাগলে আরেকটু পেস্ট দাও। ঠান্ডা কেকের ওপর গ্যানাশ ছড়িয়ে দাও, আর তুলে রাখা কুচো পেস্তা ছড়িয়ে সাজিয়ে নাও।"></li>
      </ol>

<script>

      var t = el.getAttribute('data-' + lang);
      if (t !== null) el.innerHTML = t;
    });
    document.querySelectorAll('.lang-toggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.set === lang);
    });
  }
  document.querySelectorAll('.lang-toggle button').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.set); });
  });
  setLang('en');
</script>
