      <p data-en="A home cook with far more curiosity than measuring cups — and a stubborn belief that every recipe is carrying a story." data-bn="গল্প, স্মৃতি আর কৌতূহল—এই তিনটি নিয়েই আমার রান্নাঘর।"></p>
      <p data-en="You&rsquo;ll find comfort food and quiet experiments here, flavours that wander between cultures, and never a recipe without its tale attached: a memory, a scrap of history, something that made me smile at the stove. I don&rsquo;t stand in front of cameras. I&rsquo;d rather walk you into my kitchen with words." data-bn="এখানে পাবেন চেনা স্বাদের নতুন পথচলা, ঘরোয়া খাবারের উষ্ণতা, আর প্রতিটি রেসিপির সঙ্গে জড়ানো একটি ছোট্ট গল্প কিংবা মজার তথ্য। ক্যামেরার সামনে দাঁড়ানো আমার স্বভাব নয়—আমি বরং শব্দ দিয়েই আপনাকে আমার রান্নাঘরে ডেকে নিতে চাই।"></p>
      <p class="about-welcome" data-en="Welcome to <em>The Quiet Table</em>. Pull up a chair — there&rsquo;s always room for one more." data-bn="<em>The Quiet Table</em>-এ স্বাগতম। বসুন, গল্প হোক, রান্না হোক।"></p>

<section class="about-story">
  <div class="wrap">
      <p class="eyebrow" data-en="the longer story" data-bn="একটু বিস্তারিত"></p>
      <p data-en="A recipe is rarely just about food. It carries a whole kitchen with it — the rhythm of familiar hands, conversations that outlasted dinner, and the quietest kind of love there is: someone asking whether you&rsquo;ve eaten yet." data-bn="আমার কাছে রান্না কখনও শুধু একটা রেসিপি নয়। প্রতিটি রান্নার ভেতরে থেকে যায় একটা বাড়ি, একটা রান্নাঘর, উনুনের ধোঁয়ায় মিশে থাকা বিকেল, আর সেই চেনা ডাক—&ldquo;আর একটু দিই?&rdquo;"></p>
      <p data-en="My fondest food memories come from kitchens with no measuring cups in them. Mothers and grandmothers who cooked by instinct, who kept their recipes in their hands rather than on paper, and who served every meal with something extra — a story, a family myth, a piece of wisdom nobody had thought to write down." data-bn="আমাদের অনেকেরই খাবারের সবচেয়ে প্রিয় স্মৃতি তৈরি হয়েছে মা আর ঠাকুমার রান্নাঘরে। সেখানে মাপার চামচের চেয়ে বেশি ভরসা ছিল অভ্যাসে, লেখা রেসিপির চেয়ে বেশি ছিল হাতের স্মৃতিতে। আর প্রতিটি পদ সঙ্গে করে নিয়ে আসত কোনো পারিবারিক গল্প, ছোট্ট কোনো কৌতুক, কিংবা এমন এক টুকরো স্মৃতি—যা কেবল সেই রান্নাঘরেই বেঁচে থাকে।"></p>
      <p data-en="Somewhere along the way we became very good at preserving the recipe, and rather worse at preserving the warmth around it." data-bn="সময়ের সঙ্গে আমরা রেসিপি লিখে রাখতে শিখেছি ঠিকই, কিন্তু সেই উষ্ণতা—যা আগুন থেকে নয়, মানুষ থেকে আসে—তা একটু একটু করে হারিয়ে ফেলেছি।"></p>
      <blockquote class="story-quote" data-en="This little corner of the internet is my attempt to bring some of that warmth back." data-bn="<em>The Quiet Table</em> সেই হারিয়ে যাওয়া উষ্ণতা ফিরে পাওয়ারই একটি ছোট্ট চেষ্টা।"></blockquote>
      <p data-en="The cooking here doesn&rsquo;t much respect borders. I like wandering between cuisines, borrowing from distant tables, putting familiar ingredients in unfamiliar company — and now and then finding that an experiment has quietly earned its place beside the old favourites. None of it is meant to replace tradition. Tradition has always grown by being curious." data-bn="নতুন স্বাদ খুঁজতে আমি ভালোবাসি। কখনও দূর দেশের কোনো কৌশল মিশে যায় ছোটবেলার চেনা স্বাদে, কখনও বহুদিনের পুরনো পদ ফিরে আসে একেবারে নতুন চেহারায়। ঐতিহ্যকে ভাঙার দরকার হয় না; শুধু নতুন পথ দেখিয়ে দিলেই হয়। নদী যেমন উৎস ভোলে না, রেসিপিও তেমন শিকড় হারায় না—সে কেবল নতুন তীরে গিয়ে পৌঁছয়।"></p>
      <p data-en="So every recipe here comes with more than instructions. Sometimes a story. Sometimes a forgotten way of cooking. Sometimes an odd scrap of history that made me smile while I stirred. If a dish can feed the imagination as well as the stomach, I think it has done its work." data-bn="তাই এখানে প্রতিটি রেসিপির সঙ্গে থাকে আরও একটি গল্প। কখনও সেই রান্নার জন্মকথা, কখনও ভুলে যাওয়া কোনো খাদ্যসংস্কৃতির ইতিহাস, কখনও ছোট্ট কোনো মজার তথ্য—আবার কখনও এমন এক স্মৃতি, যা হয়তো আপনাকেও আপনার নিজের রান্নাঘরে ফিরিয়ে নিয়ে যাবে।"></p>
      <p data-en="One thing you should know before you settle in." data-bn="আর একটা কথা আগেভাগেই বলে রাখি।"></p>
      <p data-en="You won&rsquo;t find many photographs of me. I&rsquo;m almost never in front of a camera, and I don&rsquo;t film myself cooking — not because I mind sharing, but because I&rsquo;ve always felt the food deserves the light. This is my way of opening the kitchen door without standing in the middle of it. I&rsquo;d rather tell you a story than ask you to watch me make one." data-bn="আমার খুব বেশি ছবি এখানে পাবেন না। রান্নার ফাঁকে ক্যামেরার সামনে দাঁড়ানো বা ভিডিও বানানো—এসব আমার স্বভাবের সঙ্গে কোনোদিন মেলেনি। আমি বিশ্বাস করি, একটা ভালো গল্প, একটা আন্তরিক রেসিপি আর একটা সুন্দর স্বাদ—এই তিনটিই মানুষকে সবচেয়ে কাছে টানে। তাই এই লেখা, এই ওয়েবসাইট—এসবই আমার রান্নাঘরের দরজা খুলে দেওয়ার উপায়।"></p>
      <p data-en="So pull up a chair." data-bn="আপনি এসেছেন, এটুকুই আমার প্রাপ্তি। একটু বসুন।"></p>
      <p data-en="Take your time. Read a little, cook a little, and follow any recipe that leads you somewhere unexpected." data-bn="হয়তো একটা রেসিপি পড়বেন, হয়তো কোনো গল্পে হারিয়ে যাবেন, কিংবা হয়তো আজই নতুন কোনো স্বাদের সঙ্গে আলাপ হবে।"></p>
      <p class="story-close" data-en="I hope these pages feel like an afternoon in a kitchen where someone is always glad to set another plate." data-bn="এই নীরব টেবিলে আপনার জন্য একটি আসন সবসময়ই রাখা আছে।"></p>
  </div>
</section>

<script>
  function setLang(lang){
    document.body.classList.toggle('bn', lang === 'bn');
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(function(el){
      var t = el.getAttribute('data-' + lang);
      if (t !== null) el.innerHTML = t;
    });
    document.querySelectorAll('.lang-toggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.set === lang);
    });
  }
  document.querySelectorAll('.lang-toggle button').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.set); });
  });
  setLang('en');
</script>
